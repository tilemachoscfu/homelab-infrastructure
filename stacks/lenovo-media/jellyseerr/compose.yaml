services:
  jellyseerr:
    image: ghcr.io/seerr-team/seerr@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
    container_name: jellyseerr
    environment:
    - LOG_LEVEL=info
    - TZ=Europe/Athens
    volumes:
    - ${LENOVO_APPDATA_ROOT:-/opt/homelab/appdata}/jellyseerr:/app/config
    ports:
    - ${LENOVO_IP:?Set LENOVO_IP}:5055:5055
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.75
    init: true
    user: 1000:1000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
