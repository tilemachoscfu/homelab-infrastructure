services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "${HOMELAB_IP:?Set HOMELAB_IP}:443:443"
    environment:
      TZ: Europe/Athens
      DISABLE_IPV6: "true"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    mem_limit: 512m
    cpus: 0.75
