services:
  sonarr:
    entrypoint:
    - /bin/sh
    - /storage-mount-guard.sh
    - /init
    image: lscr.io/linuxserver/sonarr@sha256:f247545d23ba8b233d6604575347e48a623fe6ad75dda02348bf81917f3b5c06
    container_name: sonarr
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Europe/Athens
    volumes:
    - ./config:/config
    - ${MEDIA_ROOT:-/srv/media}:/data
    - type: bind
      source: /srv/storage
      target: /storage
      bind:
        create_host_path: false
    - type: bind
      source: ${DOCKER_ROOT:-/opt/homelab}/storage-mount-guard.sh
      target: /storage-mount-guard.sh
      read_only: true
      bind:
        create_host_path: false
    ports:
    - 8989:8989
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
