services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Athens
    volumes:
      - ./config:/config
      - ${MEDIA_ROOT:-/srv/media}:/data
    ports:
      - "8686:8686"
    restart: unless-stopped
