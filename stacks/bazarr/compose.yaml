services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Athens
    volumes:
      - ./config:/config
      - ${MEDIA_ROOT:-/srv/media}:/data
    ports:
      - "6767:6767"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
