services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_ENABLESHARING: "false"
      TZ: Europe/Athens
    volumes:
      - ./data:/data
      - ${MEDIA_ROOT:-/srv/media}/Music:/music:ro
    mem_limit: 512m
