services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Athens
    volumes:
      - ./config:/config
      - ${MEDIA_ROOT:-/srv/media}:/data
    ports:
      - "7878:7878"
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.00
